name: Release

# Push a tag like v1.1.0 to build the downloads, publish to PyPI and create the GitHub Release.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: rekordbox-key-tool-windows.exe
          - os: macos-latest
            asset: rekordbox-key-tool-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name rekordbox-key-tool rekordbox_key_tool.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/rekordbox-key-tool.exe ${{ matrix.asset }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip ../${{ matrix.asset }} rekordbox-key-tool
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing, no API token stored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [binaries, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --notes-file notes.md
