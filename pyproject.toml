[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rekordbox-key-tool"
dynamic = ["version"]
description = "Convert MIK-exported keys to Camelot notation in rekordbox.xml"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
keywords = ["rekordbox", "mixed-in-key", "camelot", "harmonic-mixing", "dj"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
rekordbox-key-tool = "rekordbox_key_tool:main"

[tool.setuptools]
py-modules = ["rekordbox_key_tool"]

[tool.setuptools.dynamic]
version = { attr = "rekordbox_key_tool.__version__" }

[project.urls]
Homepage = "https://github.com/squelch303"
Repository = "https://github.com/squelch303/rekordbox-key-tool"
Issues = "https://github.com/squelch303/rekordbox-key-tool/issues"
